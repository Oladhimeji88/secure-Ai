version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OTEL_SERVICE_NAME: aegis-api
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./fixtures:/fixtures
      - ./scripts:/scripts

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_URL_INTERNAL: http://api:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  postgres_data:
